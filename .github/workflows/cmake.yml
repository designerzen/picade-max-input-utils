name: CMake

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: CMake build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
      release_tag:
        description: Optional tag to create and publish (for example, v0.1.0)
        required: false
        type: string
      prerelease:
        description: Mark a manually created release as a prerelease
        required: true
        default: true
        type: boolean
  push:
  pull_request:
  release:
    types: [created]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

permissions:
  contents: write

jobs:
  build:
    name: ${{matrix.name}}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
            cache-key: linux
            cmake-args: '-DPIMORONI_PICO_PATH=$GITHUB_WORKSPACE/pimoroni-pico -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk'
            apt-packages: clang-tidy gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

    runs-on: ${{matrix.os}}
    timeout-minutes: 30

    env:
      PICO_SDK_PATH: $GITHUB_WORKSPACE/pico-sdk
      PIMORONI_PICO_LIBS: $GITHUB_WORKSPACE/pimoroni-pico
      RELEASE_FILE: ${{github.event.repository.name}}-${{github.event.release.tag_name || inputs.release_tag || github.sha}}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: project

    # Checkout the Pimoroni Pico Libraries
    - name: Checkout Pimoroni Pico Libraries
      uses: actions/checkout@v4
      with:
        repository: pimoroni/pimoroni-pico
        path: pimoroni-pico

    # Checkout the Pico SDK
    - name: Checkout Pico SDK
      uses: actions/checkout@v4
      with:
        repository: raspberrypi/pico-sdk
        path: pico-sdk
        # TinyUSB 0.18 includes device/HID enumeration fixes absent from the
        # 0.15 stack used by the original Picade firmware release.
        ref: 2.3.0
        submodules: true

    # Linux deps
    - name: Install deps
      if: runner.os == 'Linux'
      run: |
        sudo apt update && sudo apt install ${{matrix.apt-packages}}

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE/project/firmware -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCPACK_PACKAGE_FILE_NAME=${{env.RELEASE_FILE}} -DCMAKE_INSTALL_PREFIX=`pwd`/install ${{matrix.cmake-args}}

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        cmake --build . --config $BUILD_TYPE -j 2

    - name: Prepare Artifact
      if: github.event_name != 'release'
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        cmake --build . --config $BUILD_TYPE --target install -j 2

    - name: Upload Artifact
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.RELEASE_FILE}}
        path: ${{runner.workspace}}/build/install

    - name: Build Release Packages
      if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        cmake --build . --config $BUILD_TYPE --target package -j 2

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
      working-directory: ${{runner.workspace}}/build
      shell: bash
      env:
        GH_TOKEN: ${{github.token}}
        GH_REPO: ${{github.repository}}
        RELEASE_TAG: ${{inputs.release_tag}}
        IS_PRERELEASE: ${{inputs.prerelease}}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
          echo "Invalid release tag: $RELEASE_TAG" >&2
          exit 1
        fi

        release_args=(--target "$GITHUB_SHA" --generate-notes)
        if [[ "$IS_PRERELEASE" == "true" ]]; then
          release_args+=(--prerelease)
        fi

        gh release create "$RELEASE_TAG" \
          "${RELEASE_FILE}.zip" \
          "${RELEASE_FILE}.tar.gz" \
          "${release_args[@]}"

    - name: Upload packages to existing GitHub Release
      if: github.event_name == 'release'
      working-directory: ${{runner.workspace}}/build
      shell: bash
      env:
        GH_TOKEN: ${{github.token}}
        GH_REPO: ${{github.repository}}
        RELEASE_TAG: ${{github.event.release.tag_name}}
      run: |
        gh release upload "$RELEASE_TAG" \
          "${RELEASE_FILE}.zip" \
          "${RELEASE_FILE}.tar.gz" \
          --clobber
